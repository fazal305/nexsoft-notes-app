<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nexsoft Notes | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="auth-body">

  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="auth-brand">
        <span>&lt;Notes /&gt;</span>
        <h1>Nexsoft Notes</h1>
        <p>Secure full-stack notes management system</p>
      </div>

      <div id="auth-message" class="auth-message d-none"></div>

      <form id="login-form" class="auth-form">
        <h2>Login</h2>

        <input type="email" id="login-email" class="form-control" placeholder="Email address" required>
        <input type="password" id="login-password" class="form-control" placeholder="Password" required>

        <button type="submit" class="btn auth-btn w-100">Login</button>

        <p class="auth-switch">
          Don't have an account?
          <button type="button" id="show-register-btn">Create one</button>
        </p>
      </form>

      <form id="register-form" class="auth-form d-none">
        <h2>Create Account</h2>

        <input type="text" id="register-name" class="form-control" placeholder="Full name" required>
        <input type="email" id="register-email" class="form-control" placeholder="Email address" required>
        <input type="password" id="register-password" class="form-control" placeholder="Password minimum 6 characters" required>

        <button type="submit" class="btn auth-btn w-100">Register</button>

        <p class="auth-switch">
          Already have an account?
          <button type="button" id="show-login-btn">Login</button>
        </p>
      </form>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
