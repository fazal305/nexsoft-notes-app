<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nexsoft Notes | Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="dashboard-body">

  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-logo">&lt;Notes /&gt;</div>

    <nav class="sidebar-nav">
      <button class="nav-link-btn active" data-category="">
        <i class="bi bi-journal-text"></i>
        All Notes
      </button>

      <button class="nav-link-btn" id="show-pinned-btn">
        <i class="bi bi-pin-angle"></i>
        Pinned
      </button>

      <button class="nav-link-btn" id="show-recent-btn">
        <i class="bi bi-clock-history"></i>
        Recent
      </button>
    </nav>

    <div class="sidebar-section">
      <h3>Categories</h3>
      <div id="category-list" class="category-list">
        <button class="category-pill active" data-category="">All</button>
      </div>
    </div>

    <div class="sidebar-user">
      <div>
        <span id="sidebar-user-name">User</span>
        <small>Logged in</small>
      </div>

      <button id="logout-btn" class="logout-btn" title="Logout">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-topbar">
      <button id="hamburger-btn" class="hamburger-btn">
        <i class="bi bi-list"></i>
      </button>

      <div class="search-wrapper">
        <i class="bi bi-search"></i>
        <input type="text" id="search-input" placeholder="Search notes..." />
        <button id="clear-search-btn" class="clear-search-btn d-none">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="view-toggle">
        <button id="grid-view-btn" class="view-btn active">
          <i class="bi bi-grid-3x3-gap"></i>
        </button>

        <button id="list-view-btn" class="view-btn">
          <i class="bi bi-list-ul"></i>
        </button>
      </div>
    </header>

    <section class="dashboard-heading">
      <div>
        <p class="eyebrow">Nexsoft Solutions Internship</p>
        <h1>Notes Dashboard</h1>
      </div>

      <button id="desktop-add-note-btn" class="btn dashboard-add-btn">
        <i class="bi bi-plus-lg"></i>
        Add Note
      </button>
    </section>

    <section class="stats-grid">
      <article class="stat-card">
        <span id="total-notes">0</span>
        <p>Total Notes</p>
      </article>

      <article class="stat-card">
        <span id="pinned-notes">0</span>
        <p>Pinned Notes</p>
      </article>

      <article class="stat-card">
        <span id="category-count">0</span>
        <p>Categories Used</p>
      </article>
    </section>

    <section id="notes-grid" class="notes-grid"></section>

    <section id="empty-state" class="empty-state d-none">
      <div>📝</div>
      <h2>No notes found</h2>
      <p>Create your first note or try a different search.</p>
    </section>
  </main>

  <button id="add-note-btn" class="floating-add-btn">
    <i class="bi bi-plus-lg"></i>
  </button>

  <div class="modal fade" id="note-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content note-modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="note-modal-title">Add Note</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <form id="note-form">
          <div class="modal-body">
            <input type="hidden" id="note-id">

            <label class="form-label">Title</label>
            <input type="text" id="note-title" class="form-control" maxlength="100" required>

            <label class="form-label">Content</label>
            <textarea id="note-content" class="form-control" rows="5" required></textarea>

            <label class="form-label">Category</label>
            <select id="note-category" class="form-select">
              <option value="General">General</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Ideas">Ideas</option>
              <option value="Study">Study</option>
            </select>

            <label class="form-label">Accent Color</label>
            <div class="color-swatches">
              <button type="button" class="color-swatch active" data-color="#00f5ff" style="background:#00f5ff"></button>
              <button type="button" class="color-swatch" data-color="#bf5fff" style="background:#bf5fff"></button>
              <button type="button" class="color-swatch" data-color="#f5a623" style="background:#f5a623"></button>
              <button type="button" class="color-swatch" data-color="#00ff88" style="background:#00ff88"></button>
              <button type="button" class="color-swatch" data-color="#ff3860" style="background:#ff3860"></button>
              <button type="button" class="color-swatch" data-color="#e8e8f0" style="background:#e8e8f0"></button>
            </div>

            <div class="form-check pin-check">
              <input class="form-check-input" type="checkbox" id="note-pinned">
              <label class="form-check-label" for="note-pinned">
                Pin this note
              </label>
            </div>

            <div id="note-form-message" class="form-message d-none"></div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn modal-cancel-btn" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn modal-save-btn">Save Note</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
